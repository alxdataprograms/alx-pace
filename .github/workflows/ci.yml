name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets a deploy be re-driven without an empty commit. Re-running a *failed*
  # run is not a substitute: the rerun uploads a second github-pages artifact
  # into the same run and deploy-pages then refuses, unable to tell which of
  # the two to publish.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs, but never cancel a main-branch run mid-deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Deterministic data gate: 14 weeks, 4 modules, forward-fill, stable ids.
      - name: Verify curriculum parser
        run: npm run parser:check

      - name: Build
        run: npm run build

  deploy:
    name: deploy
    needs: verify
    # Overrides the top-level block wholesale, so every scope this job needs is
    # listed. `contents: write` is here and nowhere else: it exists solely to
    # push the rollback tag below, and `verify` stays read-only.
    permissions:
      contents: write
      pages: write
      id-token: write
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build for GitHub Pages
        run: npm run build
        env:
          BASE_PATH: /alx-pace/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v5

      # A NAMED ROLLBACK POINT FOR EVERY VERSION THAT REACHED LEARNERS.
      #
      # Without this, "put the previous version back" means reading the log and
      # working out which commit was last live. With it, `git tag` is the list.
      #
      # Tagged AFTER deploy-pages, never before: a tag on a build that failed to
      # publish would be a trap, pointing at something that was never live.
      #
      # This does not retrigger CI — the workflow runs on pushes to the `main`
      # branch, and a tag lands on refs/tags/*.
      - name: Tag this deploy as a rollback point
        run: |
          set -euo pipefail
          # The sha keeps the tag unique if two deploys land in the same minute,
          # and makes the target readable without resolving the tag.
          TAG="live-$(date -u +%Y%m%d-%H%M)-$(git rev-parse --short HEAD)"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Live on GitHub Pages: $GITHUB_SHA"
          git push origin "$TAG"
          echo "### Rollback point: \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Roll back with: \`git revert <sha>\` — or inspect with \`git show $TAG\`" >> "$GITHUB_STEP_SUMMARY"
